name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  # Creates the git tag and GitHub release when the version in Cargo.toml has
  # no tag yet.
  release-plz-release:
    name: Release-plz release
    if: github.repository_owner == 'MaterializeInc'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ fromJSON(steps.release-plz.outputs.releases || '[{}]')[0].tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so the image
  # is published from here.
  docker:
    needs: release-plz-release
    if: needs.release-plz-release.outputs.releases_created == 'true'
    uses: ./.github/workflows/dockerhub.yaml
    with:
      tag: ${{ needs.release-plz-release.outputs.tag }}
    secrets: inherit

  # Opens or updates the release PR that bumps the version and changelog.
  release-plz-pr:
    name: Release-plz PR
    if: github.repository_owner == 'MaterializeInc'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Queues rather than cancels, so a push during a run is not skipped.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Run release-plz
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
