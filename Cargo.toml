[package]
name = "ephemeral-storage-setup"
version = "0.6.0"
edition = "2024"
rust-version = "1.89.0"
resolver = "2"
publish = false
# Otherwise Cargo auto-includes README.md despite `include`.
readme = false
# Only changes to files that go into the Docker image trigger a release-plz
# release.
include = [
    "/src/",
    "/Cargo.toml",
    "/Cargo.lock",
    "/lvm.conf",
    "/Dockerfile",
]

[[bin]]
name = "ephemeral-storage-setup"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
k8s-openapi = { version = "0.28.0", features = ["v1_35"] }
kube = { version = "4.2.0", default-features = false, features = ["openssl-tls"] }
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
shlex = "2.0.1"
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
